<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Image Studio</title>
<style>
:root{
  --bg:#101014;--panel:#18181e;--card:#1f1f27;--line:#2a2a34;
  --text:#ecece8;--dim:#9a9aa4;--gold:#c9a227;--gold2:#e8c547;
  --ok:#6fbf73;--danger:#d36b6b;--chip:#26262f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:#141418}
header.top .brand{font-weight:650;letter-spacing:.04em}
header.top .brand span{color:var(--gold);font-weight:500;margin-left:8px;font-size:12px}
.modes{display:flex;gap:6px;flex:1}
.modes button,.chip{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.modes button.on,.chip.on{background:#2b2414;border-color:var(--gold);color:var(--gold2)}
.shell{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
aside{border-right:1px solid var(--line);padding:14px;overflow:auto;background:var(--panel)}
main.stage{padding:18px;overflow:auto}
label{display:block;color:var(--dim);font-size:11px;margin:10px 0 6px;letter-spacing:.06em}
textarea,select,input[type=text]{width:100%;background:#121217;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{width:100%;margin-top:14px;background:var(--gold);color:#1a1406;border:0;border-radius:8px;padding:11px;font-weight:650;cursor:pointer}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card img{width:100%;display:block;background:#0b0b0e}
.card figcaption{padding:8px 10px;color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:12px}
pre.plan{background:#121217;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;max-height:280px;overflow:auto}
.status{margin-left:auto;color:var(--ok);font-size:12px}
.err{color:var(--danger)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">IMAGE STUDIO <span>Nova · Skills</span></div>
  <nav class="modes">
    <button data-mode="txt" class="on">文生图</button>
    <button data-mode="img">图生图</button>
    <button data-mode="plan">Skill 策划</button>
    <button data-mode="compose">三联拼接</button>
    <button data-mode="describe">反推</button>
  </nav>
  <div class="status" id="conn">已连接</div>
</header>
<div class="shell">
<aside>
  <label>SKILL</label>
  <select id="skill"></select>
  <label>简报 BRIEF</label>
  <textarea id="brief" placeholder="例如：明代科举舞弊案，三连镜头，先全景后对质再落款。"></textarea>
  <div id="img2imgBox" hidden>
    <label>参考图</label>
    <input id="ref" type="file" accept="image/*"/>
  </div>
  <label>画幅</label>
  <div class="row" id="ratios">
    <button class="chip" data-r="21:9">21:9 电影</button>
    <button class="chip" data-r="16:9">16:9</button>
    <button class="chip" data-r="3:4">3:4 海报</button>
    <button class="chip" data-r="1:1">1:1</button>
    <button class="chip" data-r="9:16">9:16</button>
  </div>
  <label>张数</label>
  <div class="row" id="counts">
    <button class="chip on" data-n="1">1</button>
    <button class="chip" data-n="2">2</button>
    <button class="chip" data-n="3">3</button>
  </div>
  <label>提供方</label>
  <select id="provider"></select>
  <button class="btn" id="go">开始生成</button>
  <p class="hint" id="hint">cinema-dna 会锁 21:9；海报模式仅在你明确要海报时启用。</p>
</aside>
<main class="stage">
  <p class="hint" id="empty">选一个 skill，写下简报，点开始生成。策划模式只出 CreativePlan，不出图。</p>
  <pre class="plan" id="planView" hidden></pre>
  <div class="grid" id="gallery"></div>
</main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const state = { mode: "txt", ratio: "21:9", n: 1, lastAssets: [] };
document.querySelectorAll(".modes button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".modes button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.mode = b.dataset.mode;
    $("img2imgBox").hidden = state.mode !== "img" && state.mode !== "describe";
    $("hint").textContent = ({
      txt: "文生图：可先策划再出图，cinema-dna 锁 21:9。",
      img: "图生图：life-force MODE A，保留人物身份。",
      plan: "只编译 CreativePlan，不调用出图。",
      compose: "用最近三张竖向拼三联，禁止让模型画三格。",
      describe: "反推分析，结果不写进系统提示词。",
    })[state.mode];
  };
});
document.querySelectorAll("#ratios .chip").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("#ratios .chip").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.ratio = b.dataset.r;
  };
});
document.querySelectorAll("#counts .chip").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("#counts .chip").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.n = Number(b.dataset.n);
  };
});
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch("/imagestudio/api" + path, opt);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function showPlan(plan) {
  $("planView").hidden = !plan;
  $("planView").textContent = plan ? JSON.stringify(plan, null, 2) : "";
}
function showImages(images) {
  const g = $("gallery");
  g.innerHTML = "";
  for (const img of images || []) {
    const fig = document.createElement("figure");
    fig.className = "card";
    const im = document.createElement("img");
    im.src = img.url || ("/imagestudio/api/file?p=" + encodeURIComponent(img.path));
    const cap = document.createElement("figcaption");
    cap.textContent = (img.width || "?") + "×" + (img.height || "?") + " · " + (img.path || "");
    fig.append(im, cap);
    g.append(fig);
  }
}
async function boot() {
  try {
    const meta = await api("/meta");
    $("skill").innerHTML = (meta.skills || []).map((s) => `<option value="${s.id}">${s.id} · ${s.title || ""}</option>`).join("");
    $("provider").innerHTML = (meta.providers || []).map((p) => `<option value="${p.id}">${p.id} / ${p.model}</option>`).join("");
    const dna = [...$("skill").options].find((o) => o.value.includes("cinema-dna"));
    if (dna) $("skill").value = dna.value;
    document.querySelector('#ratios [data-r="21:9"]')?.classList.add("on");
    $("conn").textContent = "已连接 · " + (meta.providers || []).length + " provider";
  } catch (e) {
    $("conn").textContent = "未连接";
    $("conn").className = "status err";
  }
}
$("go").onclick = async () => {
  $("go").disabled = true;
  $("empty").textContent = "处理中…";
  try {
    const skillId = $("skill").value;
    const brief = $("brief").value.trim();
    if (!brief) throw new Error("请先写简报");
    if (state.mode === "plan") {
      const out = await api("/plan", { skillId, brief });
      showPlan(out.plan);
      $("empty").textContent = out.plan?.selfCheck?.passed ? "策划通过" : "策划未过 veto / 分数线";
      return;
    }
    if (state.mode === "describe") {
      const file = $("ref").files[0];
      const out = await api("/describe", { instruction: brief, fileName: file?.name, fileB64: file ? await fileToB64(file) : undefined });
      showPlan(out);
      $("empty").textContent = "反推完成";
      return;
    }
    if (state.mode === "compose") {
      const out = await api("/compose", { assets: state.lastAssets.map((a) => a.path), title: brief });
      state.lastAssets = out.images || [];
      showImages(out.images);
      $("empty").textContent = "三联已拼接";
      return;
    }
    let refB64, refName;
    if (state.mode === "img") {
      const file = $("ref").files[0];
      if (!file) throw new Error("图生图需要参考图");
      refName = file.name;
      refB64 = await fileToB64(file);
    }
    const out = await api("/generate", {
      skillId, brief, aspectRatio: state.ratio, n: state.n,
      providerId: $("provider").value, mode: state.mode, refName, refB64,
    });
    showPlan(out.plan);
    state.lastAssets = out.images || [];
    showImages(out.images);
    $("empty").textContent = out.note || "完成";
  } catch (e) {
    $("empty").textContent = "";
    $("empty").innerHTML = '<span class="err">' + (e.message || e) + "</span>";
  } finally {
    $("go").disabled = false;
  }
};
function fileToB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
boot();
</script>
</body>
</html>

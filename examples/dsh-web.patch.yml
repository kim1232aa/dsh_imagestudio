# Generated by scripts/gen-dsh-patch.mjs — do not hand-edit paths.
#
# 本文件是占位模板：官方第一插件教程要求 name: 为绝对路径，不同机器路径不同，
# 请先运行 `node scripts/gen-dsh-patch.mjs` 重新生成本机绝对路径版本，再：
#
#   npx @deepseek-ai/dsh web --patch <本仓库绝对路径>/examples/dsh-web.patch.yml
#
# Then open http://127.0.0.1:3080 → Settings → Plugins.
# You should see image-core / image-compose / image-guard / image-assets /
# image-skills / image-provider-mock / image-tools / image-ui (ACTIVE).
# Chat tools should include istudio_skill_plan, istudio_generate, istudio_edit,
# istudio_describe, istudio_compose, istudio_assets.

- insert:
    - id: image-core
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/core/src/index.ts'

    - id: image-compose
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/compose/src/index.ts'

    - id: image-guard
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/guard/src/index.ts'

    - id: image-assets
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/assets/src/index.ts'
      config:
        workspaceRoot: !!js process.cwd()
        keepLastTasks: 0 # 0 = 永不自动删除产物

    - id: image-skills
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/skills/src/index.ts'
      config:
        dir: '<ABSOLUTE_PATH_TO_REPO>/skills'
        enabled:
          - cinema-dna-21x9x3
          - life-force-portrait
          - photography-simulation
          - movie-poster
          - character-casting

    - id: image-provider-mock
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/provider-mock/src/index.ts'

    - id: image-tools
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/tools/src/index.ts'
      config:
        limits:
          concurrency: 3
          perTaskTimeoutMs: 180000
          maxImagesPerCall: 4

    - id: image-ui
      name: '<ABSOLUTE_PATH_TO_REPO>/packages/ui/src/index.ts'

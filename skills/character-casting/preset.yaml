id: character-casting
version: 1.0.0
title: Character casting
source: SKILL.md

triggers:
  - 设计一个角色
  - 原创人物设定
  - 电影选角图
  - 角色三视图
  - 白底角色图
  - '模特 casting 卡'
  - 人物设定图
antiTriggers:
  - 把真人照片变好看
  - 动漫角色
  - 游戏角色
  - 电影海报

modes:
  sheet:
    shots: 1
    aspectRatio: '3:4'

constraints:
  referenceImages:
    usage: analysis-only
    maxDimensions: 1
  negativePatch: >
    no face swap, no generic stock model, no beauty-lighting mask
  bannedPromptTerms: [beautiful, masterpiece, cinematic]
  perShotLimits:
    sceneFacts: [2, 3]
    primaryAction: 1
    lightSources: 1
    compositionMechanisms: 1

planFields:
  - 人物
  - 事件
  - 镜头

scoring:
  threshold: 82
  rubric:
    - { item: 描述可复用且不覆盖动作, max: 50 }
    - { item: 身份锚点保留, max: 50 }
  vetoes:
    - 换脸或陌生模特

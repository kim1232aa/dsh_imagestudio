id: character-casting
version: 1.0.0
title: Character casting
source: SKILL.md

modes:
  sheet:
    shots: 1
    aspectRatio: '3:4'

constraints:
  referenceImages:
    usage: analysis-only
    maxDimensions: 1
  negativePatch: >
    no face swap, no generic stock model, no beauty-lighting mask
  bannedPromptTerms: [beautiful, masterpiece, cinematic]
  perShotLimits:
    sceneFacts: [2, 3]
    primaryAction: 1
    lightSources: 1
    compositionMechanisms: 1

planFields:
  - 人物
  - 事件
  - 镜头

scoring:
  threshold: 82
  rubric:
    - { item: 描述可复用且不覆盖动作, max: 50 }
    - { item: 身份锚点保留, max: 50 }
  vetoes:
    - 换脸或陌生模特

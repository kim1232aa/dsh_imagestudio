id: movie-poster
version: 0.9.0
title: Movie poster (superseded)
source: SKILL.md
supersededBy: cinema-dna-21x9x3

triggers:
  - 电影海报
  - 设计一张海报
  - '9:16 竖版海报'
  - 片名海报
  - 书法标题海报
  - 不同题材的海报
  - 海报底图
antiTriggers:
  - 电影静帧
  - 电影感分镜
  - 社媒封面
  - 小红书图

modes:
  poster:
    trigger: explicit
    shots: 1
    aspectRatio: '3:4'
    mustContainInPrompt:
      - 3:4 vertical poster composition
    textStrategy: two-stage

constraints:
  referenceImages:
    usage: analysis-only
    maxDimensions: 1
  negativePatch: >
    no CGI concept art, no game key art, no glossy AI rendering
  bannedPromptTerms: [cinematic, beautiful, masterpiece, epic]
  perShotLimits:
    sceneFacts: [2, 3]
    primaryAction: 1
    lightSources: 1
    compositionMechanisms: 1

planFields:
  - 不可解决的状态
  - 色彩命题
  - 成像基底

scoring:
  threshold: 82
  rubric:
    - { item: 海报构图与片名策略, max: 50 }
    - { item: 真人实景, max: 50 }
  vetoes:
    - 明显 CG / 游戏宣传图
